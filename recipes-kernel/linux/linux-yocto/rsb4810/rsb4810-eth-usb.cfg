# Build the RSB-4810 network and USB drivers into the kernel image.
#
# The arm64 defconfig (used via KCONFIG_MODE=alldefconfig) leaves these as
# modules (CONFIG_STMMAC_ETH=m, CONFIG_PHY_ROCKCHIP_NANENG_COMBO_PHY=m), but
# minimal images do not install the kernel-modules package, leaving the board
# with no Ethernet and dead USB (dwc3/xhci defers forever on the missing
# USB3/SATA/PCIe combo PHY). Make them built-in so every image has working
# GMAC0/GMAC1 and USB out of the box.

# Synopsys DWMAC (GMAC0/GMAC1) + Rockchip glue
CONFIG_STMMAC_ETH=y
CONFIG_STMMAC_PLATFORM=y
CONFIG_DWMAC_ROCKCHIP=y

# Rockchip NANENG combo PHY (USB3 / SATA / PCIe lanes)
CONFIG_PHY_ROCKCHIP_NANENG_COMBO_PHY=y
