# RSB-4810 LVDS0 panel support (RK3568 LVDS transmitter, see the
# 000x-*.patch series and rk3568-rsb4810-lvds.dtso next to this file).
#
# The arm64 defconfig (KCONFIG_MODE=alldefconfig) builds the DRM core,
# Rockchip DRM and the backlight class as modules (CONFIG_DRM=m,
# CONFIG_DRM_ROCKCHIP=m). Tristate options depending on them cannot be
# =y while their parent is =m, so the parents are made built-in as well;
# otherwise DRM_PANEL_LVDS and BACKLIGHT_PWM would silently end up =m.
CONFIG_DRM=y
CONFIG_DRM_ROCKCHIP=y
CONFIG_BACKLIGHT_CLASS_DEVICE=y

# Rockchip LVDS encoder (RK3568 support comes from the patch series)
CONFIG_ROCKCHIP_LVDS=y

# MIPI DSI/LVDS combo D-PHY (dsi_dphy0 drives the LVDS0 lanes)
CONFIG_PHY_ROCKCHIP_INNO_DSIDPHY=y

# Generic "panel-lvds" panel driver
CONFIG_DRM_PANEL_LVDS=y

# PWM backlight (PWM4 on the RSB-4810)
CONFIG_BACKLIGHT_PWM=y
