# PACKAGECONFIG "wayland": Wayland client backend, so LVGL applications can
# run as windows of a compositor (Weston). LVGL v9.4 renders into wl_shm
# buffers on the CPU (its DMA-buffer path needs NXP G2D); Weston composites
# them on the GPU. Pointer, touch and keyboard come from the Wayland seat.
CONFIG_LV_USE_WAYLAND=y
