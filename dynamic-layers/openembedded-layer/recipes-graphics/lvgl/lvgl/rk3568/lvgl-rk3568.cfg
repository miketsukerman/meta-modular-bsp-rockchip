# LVGL defaults for RK3568 boards (4x Cortex-A55), on top of meta-oe's
# defconfig and drm.cfg (CONFIG_LV_USE_LINUX_DRM, CONFIG_LV_USE_EVDEV).
# Symbol names are those of LVGL v9.4.0's Kconfig.

# XRGB8888 framebuffers
CONFIG_LV_COLOR_DEPTH_32=y

# DRM rendering backend: software rendering into DRM dumb buffers, unless
# lvgl-drm-egl.cfg (PACKAGECONFIG "egl") selects the EGL backend.
CONFIG_LV_LINUX_DRM_BACKEND_FBDEV=y

# pthread OS layer, one software draw thread per core
CONFIG_LV_OS_PTHREAD=y
CONFIG_LV_DRAW_SW_DRAW_UNIT_CNT=4

# Use the C library instead of LVGL's fixed-size (64 KiB) heap, which is
# too small for full-HD displays
CONFIG_LV_USE_CLIB_MALLOC=y
CONFIG_LV_USE_CLIB_STRING=y
CONFIG_LV_USE_CLIB_SPRINTF=y

# abort() on failed assertions instead of LVGL's default endless loop
CONFIG_LV_ASSERT_HANDLER_INCLUDE="lv_assert_abort.h"

# Log warnings and errors to stdout
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_WARN=y
CONFIG_LV_LOG_PRINTF=y

# Build and install liblvgl_demos with the widgets demo (lvgl-demo), plus
# the font sizes it uses
CONFIG_LV_BUILD_DEMOS=y
CONFIG_LV_USE_DEMO_WIDGETS=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_24=y
