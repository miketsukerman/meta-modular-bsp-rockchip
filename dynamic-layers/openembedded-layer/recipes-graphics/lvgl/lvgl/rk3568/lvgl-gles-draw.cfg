# PACKAGECONFIG "gles-draw" (needs "egl"): OpenGL ES draw unit (cached
# OpenGL ES textures), the GPU draw unit of LVGL v9.4 (NanoVG arrives with
# v9.5). It is registered for every display and needs a current GL
# context, so it cannot be combined with the wl_shm based Wayland backend.
CONFIG_LV_USE_DRAW_OPENGLES=y
