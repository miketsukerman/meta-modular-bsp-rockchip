# PACKAGECONFIG "egl": the DRM backend presents through EGL/OpenGL ES on a
# GBM surface (Mesa panfrost on the RK3568's Mali-G52) instead of software
# rendering into dumb buffers. Drawing stays on the CPU unless "gles-draw"
# adds the OpenGL ES draw unit.
CONFIG_LV_LINUX_DRM_BACKEND_EGL=y
CONFIG_LV_USE_OPENGLES=y
