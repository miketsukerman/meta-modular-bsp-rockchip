# PACKAGECONFIG "egl": render through EGL/OpenGL ES on a GBM surface
# instead of software rendering into dumb buffers (Mesa panfrost on the
# RK3568's Mali-G52).
CONFIG_LV_LINUX_DRM_BACKEND_EGL=y
CONFIG_LV_USE_OPENGLES=y

# OpenGL ES draw unit (cached OpenGL ES textures), the GPU draw unit
# available in LVGL v9.4 (NanoVG arrives with v9.5)
CONFIG_LV_USE_DRAW_OPENGLES=y
