# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "eecc-rockchip"
BBFILE_PATTERN_eecc-rockchip = "^${LAYERDIR}/"
BBFILE_PRIORITY_eecc-rockchip = "9"
LAYERVERSION_eecc-rockchip = "1"
LAYERSERIES_COMPAT_eecc-rockchip = "wrynose"
LAYERDEPENDS_eecc-rockchip = "core rockchip"

# Optional content for other layers, only parsed when that layer is in
# bblayers.conf. The layer itself depends on core and meta-rockchip only.
#   openembedded-layer (meta-oe): LVGL integration (lvgl bbappend, DRM demo,
#   packagegroup-advantech-lvgl)
BBFILES_DYNAMIC += " \
    openembedded-layer:${LAYERDIR}/dynamic-layers/openembedded-layer/recipes-*/*/*.bb \
    openembedded-layer:${LAYERDIR}/dynamic-layers/openembedded-layer/recipes-*/*/*.bbappend \
"
LAYERRECOMMENDS_eecc-rockchip = "openembedded-layer"
