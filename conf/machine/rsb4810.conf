#@TYPE: Machine
#@NAME: Advantech RSB-4810
#@DESCRIPTION: Advantech RSB-4810 3.5" SBC based on the Rockchip RK3568
#https://www.advantech.com/en-us/products/single-board-computers/rsb-4810

MACHINEOVERRIDES =. "rsb4810:"

require conf/machine/include/rk3568.inc

KERNEL_DEVICETREE = "rockchip/rk3568-rsb4810.dtb"
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

UBOOT_MACHINE = "evb-rk3568_defconfig"

SERIAL_CONSOLES = "1500000;ttyS2"

# Bootable SD card / eMMC disk image (wic), inherited from upstream
# meta-rockchip (rockchip-wic.inc via rk3568.inc above): rockchip.wks lays
# out GPT with raw boot sectors (idbloader.img at sector 64, U-Boot proper
# at sector 16384) and the ext4 rootfs (rootfsA) at sector 32768 — the
# canonical Rockchip SD card layout, no FAT boot partition needed. Mainline
# U-Boot SPL on this board probes SD (sdmmc0) before eMMC (same-as-spl
# boot order), but the RK3568 BootROM itself tries the eMMC first: the SD
# card only boots while the eMMC loader area is empty/erased.
WKS_FILE ?= "rockchip.wks"

# eMMC update image (Rockchip update.img) packaging, as used by the
# Advantech upgrade flow (SD upgrade card or USB OTG loader mode)
IMAGE_CLASSES += "rockchip-update-img"
IMAGE_FSTYPES += "update-img"
RK_UPDATE_MACHINE_MODEL = "RSB-4810"

# SD upgrade card image (bootable wic + RK_UPDATE FAT volume): boots from
# SD and self-flashes the wic payload to the eMMC via the
# rockchip-sd-installer service — the Linux replacement for SDDiskTool
IMAGE_CLASSES += "rockchip-sdupdate-img"
IMAGE_FSTYPES += "sdupdate-img"
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "rockchip-sd-installer"

